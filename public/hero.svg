<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 渐变圆角方块背景 -->
  <rect x="20" y="20" width="360" height="360" rx="80" fill="#12121a"/>
  <rect x="20" y="20" width="360" height="360" rx="80" fill="none" stroke="url(#bg)" stroke-width="4"/>
  <!-- 装饰性代码符号 -->
  <g filter="url(#glow)" fill="none" stroke="url(#bg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="150,160 110,200 150,240"/>
    <polyline points="250,160 290,200 250,240"/>
    <line x1="222" y1="150" x2="178" y2="250"/>
  </g>
  <!-- 光点装饰 -->
  <circle cx="90" cy="90" r="10" fill="#a855f7" opacity="0.7"/>
  <circle cx="320" cy="310" r="8" fill="#22d3ee" opacity="0.7"/>
  <circle cx="310" cy="80" r="5" fill="#22d3ee" opacity="0.5"/>
</svg>
